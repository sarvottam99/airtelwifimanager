plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sarvo.routerdevices'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sarvo.routerdevices'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
